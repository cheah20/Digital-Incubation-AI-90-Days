<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Engineer Path</title>
<meta name="description" content="A self-paced, bilingual path to becoming an AI engineer: a 90-lesson plan plus lessons from AI Engineering from Scratch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,800&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js" defer></script>
<script src="vendor/aiefs/lesson-figures.js" defer></script>
<style>
/* paper and fountain-pen ink in light mode, blackboard and chalk in dark mode */
:root {
  --paper: #f7f8f8; --ink: #1b2230; --ink2: #4a5363; --ink3: #687080; --rule: #d8dce2; --soft: #eceef1; --raise: #ffffff;
  --pen: #2340a8; --mark: #f4dc6b; --mark-ink: #1b2230; --cell: #e3e6ea; --ok: #1f6f4e; --warn: #9a5a0e; --bad: #b1402e;
  --serif: "Source Serif 4", "Noto Serif SC", "Songti SC", serif; --sans: "IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #13171d; --ink: #e7e9ec; --ink2: #b6bcc5; --ink3: #8f97a3; --rule: #2b313b; --soft: #1b2028; --raise: #1a1f27;
  --pen: #a3b6ff; --mark: #e6c75a; --mark-ink: #15181d; --cell: #232933; --ok: #6fd3a5; --warn: #e2a73b; --bad: #ef8a76; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #13171d; --ink: #e7e9ec; --ink2: #b6bcc5; --ink3: #8f97a3; --rule: #2b313b; --soft: #1b2028; --raise: #1a1f27;
  --pen: #a3b6ff; --mark: #e6c75a; --mark-ink: #15181d; --cell: #232933; --ok: #6fd3a5; --warn: #e2a73b; --bad: #ef8a76; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.7 var(--sans); }
a { color: var(--pen); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
code { font-family: ui-monospace, Menlo, monospace; font-size: .86em; background: var(--soft); padding: 1px 5px; border-radius: 4px; }
kbd { font: 12px ui-monospace, Menlo, monospace; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink2); }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 32px; }
.tr { display: block; color: var(--ink3); font-size: .9em; font-family: var(--sans); font-weight: 400; }
.small { font-size: 14px; color: var(--ink3); }
.serif { font-family: var(--serif); }
textarea, input[type=text], input[type=password], input[type=number], select { border: 1px solid var(--rule); background: var(--raise); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 84px; resize: vertical; }
textarea:focus, input:focus, select:focus { outline: none; border-color: var(--ink); }

/* masthead */
.mast { border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); }
.mast .wrap { display: flex; align-items: center; gap: 30px; padding-top: 14px; padding-bottom: 12px; }
.title { font: 800 21px var(--serif); white-space: nowrap; cursor: pointer; }
.mast nav { display: flex; gap: 22px; align-items: center; }
.mast nav button, .more summary { border: 0; background: none; padding: 2px 0; cursor: pointer; color: var(--ink2); list-style: none; }
.mast nav button.on, .more.on summary { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.more { position: relative; }
.more summary::-webkit-details-marker { display: none; }
.more summary::after { content: " ▾"; font-size: 11px; }
.more .menu { position: absolute; top: 30px; left: -12px; background: var(--raise); border: 1px solid var(--rule); border-radius: 10px; padding: 6px; min-width: 190px; box-shadow: 0 14px 30px -14px rgba(0,0,0,.35); }
.more .menu button { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 6px; box-shadow: none; }
.more .menu button:hover { background: var(--soft); }
.prefs { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.switch { display: flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; font-size: 13.5px; }
.switch button { border: 0; background: none; padding: 3px 10px; cursor: pointer; color: var(--ink2); }
.switch button + button { border-left: 1px solid var(--rule); }
.switch button.on { background: var(--ink); color: var(--paper); }
main.wrap { padding-top: 48px; padding-bottom: 96px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); padding: 9px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; }
.btn.ghost { background: none; color: var(--ink); }
.btn.sm { padding: 5px 12px; font-size: 14px; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.textlink { border: 0; background: none; padding: 0; color: var(--pen); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
h1.page { font: 800 36px/1.2 var(--serif); margin: 0; }
h2.sec { font: 600 24px var(--serif); margin: 56px 0 6px; }
.sec-note { color: var(--ink2); margin: 6px 0 18px; max-width: 70ch; }

/* overview */
.lead { display: grid; grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: end; margin-bottom: 44px; }
.lead h1 { font: 800 46px/1.16 var(--serif); margin: 0; }
.lead p { margin: 16px 0 0; color: var(--ink2); font-size: 17px; max-width: 48ch; }
.resume { border-left: 3px solid var(--mark); padding: 4px 0 4px 20px; }
.resume b { display: block; font: 600 21px/1.35 var(--serif); margin: 4px 0; }
.resume .with { color: var(--ink2); font-size: 15px; margin-bottom: 14px; }
.facts { display: flex; gap: 30px; flex-wrap: wrap; margin: 0 0 18px; }
.facts div b { display: block; font: 600 26px var(--serif); font-variant-numeric: tabular-nums; }
.facts div span { font-size: 13.5px; color: var(--ink3); }

/* the 90-lesson map */
.map { border-top: 1px solid var(--ink); }
.chap { display: grid; grid-template-columns: 220px 1fr 70px; gap: 20px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.chap .name { line-height: 1.35; }
.chap .name i { font-style: normal; font: 600 13px var(--sans); color: var(--ink3); display: block; }
.chap .name span { font: 600 16px var(--serif); }
.cells { display: flex; flex-wrap: wrap; gap: 5px; }
.cell { width: 38px; height: 38px; border-radius: 6px; border: 0; background: var(--cell); color: var(--ink2); font: 500 13px var(--sans); font-variant-numeric: tabular-nums; cursor: pointer; position: relative; transition: transform .12s; }
.cell:hover { transform: translateY(-2px); outline: 2px solid var(--ink3); outline-offset: 1px; }
.cell.done { background: var(--ink); color: var(--paper); }
.cell.half { background: linear-gradient(135deg, var(--ink) 50%, var(--cell) 50%); color: var(--paper); }
.cell.missed { box-shadow: inset 0 0 0 2px var(--bad); }
.cell.next { background: var(--mark); color: var(--mark-ink); font-weight: 700; }
.cell.exam::after { content: ""; position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .7; }
.cell.here { outline: 2px solid var(--ink); outline-offset: 2px; }
.chap .count { text-align: right; font-size: 14px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 14px; font-size: 14px; color: var(--ink3); }
.legend i { display: inline-block; width: 13px; height: 13px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; background: var(--cell); }
@media (prefers-reduced-motion: no-preference) {
  .map.ink .cell.done, .map.ink .cell.half { animation: ink .35s ease-out both; animation-delay: calc(var(--i) * 18ms); }
  .cell.just { animation: ink .6s ease-out both; }
  @keyframes ink { from { background: var(--cell); color: var(--ink2); } }
}
.peek { position: absolute; z-index: 30; width: 300px; background: var(--raise); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; box-shadow: 0 12px 30px -12px rgba(0,0,0,.35); pointer-events: none; font-size: 14px; }
.peek b { display: block; font: 600 16px/1.35 var(--serif); }
.peek .s { color: var(--ink3); }
.peek ul { margin: 6px 0 0; padding-left: 16px; color: var(--ink2); }
.later { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin-top: 56px; }
.card { border-top: 1px solid var(--ink); padding-top: 14px; }
.card h2 { font: 600 20px var(--serif); margin: 0 0 10px; }
.q { font: 600 19px/1.5 var(--serif); margin: 6px 0 4px; min-height: 3em; }
.cb { display: grid; grid-template-columns: 1fr 120px 52px; gap: 12px; align-items: center; font-size: 14.5px; padding: 4px 0; }
.bar { height: 6px; background: var(--cell); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); }
.cb span:last-child { text-align: right; color: var(--ink3); font-variant-numeric: tabular-nums; }

/* tables */
table.read { width: 100%; border-collapse: collapse; }
table.read th { text-align: left; font: 600 13px var(--sans); color: var(--ink3); padding: 0 12px 8px 0; border-bottom: 1px solid var(--ink); }
table.read td { padding: 13px 12px 13px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.read tr.r:hover td { background: color-mix(in srgb, var(--mark) 12%, transparent); }
td.code { width: 170px; } td.code b { display: block; font-size: 17px; } td.code span { font-size: 13.5px; color: var(--ink3); }
td.what .zh { color: var(--ink2); font-size: 15px; }
td.where { width: 150px; font-size: 14px; }
td.where button { border: 0; background: none; padding: 0 6px 0 0; color: var(--pen); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-variant-numeric: tabular-nums; }
td.lang { width: 90px; font-size: 14px; color: var(--ink2); }
td.go { width: 160px; font-size: 14px; } td.go a { display: inline-block; margin-right: 10px; }
.group { font: 600 17px var(--serif); padding: 26px 0 8px !important; border-bottom: 1px solid var(--ink) !important; }
.group span { font: 400 14px var(--sans); color: var(--ink3); margin-left: 10px; }
.save-btn { border: 0; background: none; cursor: pointer; color: var(--ink3); font-size: 18px; line-height: 1; padding: 0 4px; }
.save-btn.on { color: var(--warn); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; margin: 0 0 8px; font-size: 15px; }
.filters .lab { color: var(--ink3); font-size: 14px; }
.filters button { border: 0; background: none; padding: 2px 0; color: var(--ink2); cursor: pointer; }
.filters button.on { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--mark); }
.filters .grp { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
.find { border: 0 !important; border-bottom: 1.5px solid var(--rule) !important; border-radius: 0 !important; background: none !important; padding: 6px 2px !important; width: auto !important; min-width: 260px; margin-left: auto; }
.find:focus { border-bottom-color: var(--ink) !important; }
.found { font-size: 14px; color: var(--ink3); margin: 18px 0 4px; }

/* lesson */
.handout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 56px; }
.margin { position: sticky; top: 84px; align-self: start; }
.margin .no { font: 800 96px/1 var(--serif); letter-spacing: -.03em; }
.margin .chapname { font: 600 15px/1.4 var(--serif); margin: 10px 0 4px; }
.margin .state { font-size: 14px; color: var(--ink3); }
.margin .state b { color: var(--ink); font-weight: 600; }
.meter { height: 6px; background: var(--cell); border-radius: 3px; overflow: hidden; margin: 10px 0 0; }
.meter i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .3s; }
.mini { display: flex; flex-wrap: wrap; gap: 4px; margin: 20px 0 16px; }
.mini .cell { width: 30px; height: 30px; font-size: 12px; }
.margin .pn { display: flex; justify-content: space-between; font-size: 14px; }
.timer { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--rule); }
.timer .t { font: 600 30px var(--serif); font-variant-numeric: tabular-nums; }
.keys { margin-top: 16px; font-size: 13px; color: var(--ink3); line-height: 2; }
.body { max-width: 72ch; }
.body h1 { font: 800 38px/1.22 var(--serif); margin: 0; }
.body .en { color: var(--ink2); font-size: 18px; margin-top: 6px; }
.tags { display: flex; gap: 8px 16px; flex-wrap: wrap; margin-top: 12px; font-size: 14px; color: var(--ink3); }
.tags a, .tags button { font-size: 14px; }
.tags .flag { color: var(--warn); font-weight: 600; }
.toc { display: flex; gap: 6px 18px; flex-wrap: wrap; margin: 22px 0 0; font-size: 14px; }
.toc button { border: 0; background: none; padding: 0; color: var(--ink2); cursor: pointer; }
.toc button.on { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--mark); }
.part { margin-top: 44px; scroll-margin-top: 84px; }
.part > h2 { font: 600 20px var(--serif); margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.part > h2 small { font: 400 14px var(--sans); color: var(--ink3); }
.part h3 { font: 600 15px var(--sans); color: var(--ink2); margin: 22px 0 6px; }
.job { font-size: 17px; } .job p { margin: 0; }
.uni-list { margin: 0; padding: 0; list-style: none; }
.uni-list li { display: grid; grid-template-columns: 28px 130px 1fr auto; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.uni-list li:last-child { border-bottom: 0; }
.uni-list input { accent-color: var(--ink); width: 16px; height: 16px; }
.uni-list .c { font-weight: 600; } .uni-list .c span { display: block; font-weight: 400; font-size: 13px; color: var(--ink3); }
.uni-list .w b { font-weight: 500; background: linear-gradient(transparent 60%, color-mix(in srgb, var(--mark) 55%, transparent) 60%); }
.uni-list li.seen .w b { background: none; color: var(--ink3); text-decoration: line-through; }
.uni-list .w div { font-size: 14px; color: var(--ink3); }
.concept { border-bottom: 1px solid var(--rule); } .concept:last-child { border-bottom: 0; }
.concept > button { width: 100%; text-align: left; border: 0; background: none; padding: 12px 0; cursor: pointer; display: flex; justify-content: space-between; gap: 16px; font-weight: 600; }
.concept > button::after { content: "+"; color: var(--ink3); font-weight: 400; font-size: 20px; line-height: 1; }
.concept.open > button::after { content: "−"; }
.concept .txt { display: none; padding: 0 0 14px; } .concept.open .txt { display: block; } .concept .txt p { margin: 0; }
ul.plain { margin: 0; padding: 0; list-style: none; }
ul.plain li { padding: 8px 0; border-bottom: 1px solid var(--rule); } ul.plain li:last-child { border-bottom: 0; }
ul.plain .k { font-size: 13.5px; color: var(--ink3); margin-right: 8px; }
ul.plain .n { display: block; font-size: 14px; color: var(--ink3); }
.acc { display: block; font-size: 13.5px; color: var(--warn, var(--ink2)); }
.acc::before { content: "ⓘ "; }
.notice p { max-width: 70ch; }
.tasks label { display: flex; gap: 12px; padding: 8px 0; cursor: pointer; border-bottom: 1px solid var(--rule); }
.tasks input { margin-top: 6px; accent-color: var(--ink); width: 17px; height: 17px; flex: none; }
.tasks label.ticked > span { color: var(--ink3); text-decoration: line-through; }
.tasks em { font-style: normal; font-size: 13px; color: var(--warn); font-weight: 600; margin-right: 6px; text-decoration: none; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 16px; margin-top: 14px; font-size: 15px; }
.kv span:nth-child(odd) { color: var(--ink3); }
.sched { display: flex; gap: 10px 26px; flex-wrap: wrap; font-size: 14.5px; color: var(--ink2); margin-bottom: 6px; }
.sched b { font-weight: 600; color: var(--ink); }
.qi { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.qi .top { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline; }
.qi .no2 { color: var(--ink3); font-variant-numeric: tabular-nums; }
.qi textarea { margin: 8px 0 0 38px; width: calc(100% - 38px); min-height: 60px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--rule); background: none; border-radius: 7px; padding: 4px 12px; cursor: pointer; font-size: 14.5px; color: var(--ink2); }
.seg button.on { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.seg button.ok.on { border-color: var(--ok); color: var(--ok); }
.seg button.no.on, .seg button.missed.on { border-color: var(--bad); color: var(--bad); }
.seg button.partial.on { border-color: var(--warn); color: var(--warn); }
.log { display: grid; gap: 14px; }
.log .row { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; }
.log .row > span { width: 90px; color: var(--ink3); font-size: 14px; }
.log .row input[type=number] { width: 110px; }
.log label.full { display: block; } .log label.full span { display: block; color: var(--ink3); font-size: 14px; margin-bottom: 4px; }

/* exams and other pages */
.exam-list { border-top: 1px solid var(--ink); }
.exam-row { display: grid; grid-template-columns: 1fr 150px 130px 110px; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.exam-row b { font: 600 17px var(--serif); }
.exam-row .s { font-size: 14px; color: var(--ink3); }
.st-ok { color: var(--ok); font-weight: 600; } .st-warn { color: var(--warn); font-weight: 600; } .st-none { color: var(--ink3); }
.mcq { padding: 16px 0; border-bottom: 1px solid var(--rule); }
.mcq .qq { font-weight: 600; margin-bottom: 8px; }
.opt { display: flex; gap: 10px; padding: 6px 10px; border-radius: 8px; cursor: pointer; align-items: baseline; }
.opt:hover { background: var(--soft); }
.opt.right { background: color-mix(in srgb, var(--ok) 15%, transparent); }
.opt.wrong { background: color-mix(in srgb, var(--bad) 15%, transparent); }
.expl { margin-top: 8px; font-size: 15px; color: var(--ink2); border-left: 3px solid var(--rule); padding-left: 12px; }
.bigclock { font: 600 34px var(--serif); font-variant-numeric: tabular-nums; }
.form2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
.form2 label span, .stack label span { display: block; font-size: 14px; color: var(--ink3); margin-bottom: 4px; }
.stack { display: grid; gap: 14px; }
.books { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 40px; }
.book { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.book h3 { font: 600 17px var(--serif); margin: 0; } .book .au { font-size: 14px; color: var(--ink3); }
.book p { margin: 6px 0 0; font-size: 15px; color: var(--ink2); }
.book .meta { font-size: 13.5px; color: var(--ink3); margin-top: 6px; }
.book .meta button { border: 0; background: none; color: var(--pen); text-decoration: underline; cursor: pointer; padding: 0 4px 0 0; font-size: 13.5px; }
.milestones { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; font-size: 14.5px; }
.milestones button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink2); }
.milestones button.ok { color: var(--ok); font-weight: 600; } .milestones button.ok::before { content: "✓ "; }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 10px; font-size: 15px; z-index: 40; box-shadow: 0 10px 30px -10px rgba(0,0,0,.4); }
footer { border-top: 1px solid var(--rule); padding: 22px 0 40px; font-size: 14px; color: var(--ink3); }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.loading { padding: 80px 0; color: var(--ink3); }

@media (max-width: 1000px) {
  .lead, .later { grid-template-columns: 1fr; gap: 28px; } .handout { grid-template-columns: 1fr; gap: 24px; }
  .margin { position: static; } .margin .no { font-size: 64px; } .chap { grid-template-columns: 1fr; gap: 10px; } .chap .count { text-align: left; }
  .keys { display: none; } .books, .form2 { grid-template-columns: 1fr; } .exam-row { grid-template-columns: 1fr 1fr; }
  .mast .wrap { flex-wrap: wrap; gap: 10px 22px; } .prefs { margin-left: 0; }
}
@media (max-width: 700px) {
  .wrap { padding: 0 16px; } .mast nav { gap: 16px; flex-wrap: wrap; } .prefs { width: 100%; }
  .lead h1 { font-size: 32px; } td.lang, td.go, th.lang, th.go { display: none; } td.code { width: 110px; }
  .uni-list li { grid-template-columns: 28px 1fr; } .uni-list li > a { grid-column: 2; } .find { min-width: 0; width: 100% !important; margin-left: 0; } .cell { width: 34px; height: 34px; }
  .peek { display: none; } .kv { grid-template-columns: 1fr; } .qi textarea { margin-left: 0; width: 100%; }
}

/* path: lessons from AI Engineering from Scratch */
.phase { margin-top: 40px; }
.phase h2 { font: 600 22px var(--serif); margin: 0 0 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.phase h2 small { font: 500 14px var(--sans); color: var(--ink3); }
.units { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.units li { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.units .n { font: 500 13px var(--sans); color: var(--ink3); font-variant-numeric: tabular-nums; }
.units button { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: var(--ink); font-weight: 500; }
.units button:hover { color: var(--pen); }
.units li.done .n::before { content: "✓ "; color: var(--ok); }
.units .m { font-size: 13.5px; color: var(--ink3); }
.ulist { list-style: none; padding: 0; margin: 12px 0; font-size: 14px; max-height: 50vh; overflow: auto; }
.ulist button { border: 0; background: none; padding: 3px 0; text-align: left; cursor: pointer; color: var(--ink2); width: 100%; }
.ulist .here button { color: var(--ink); font-weight: 600; }
.ulist .done button::before { content: "✓ "; color: var(--ok); }
.doc { margin-top: 28px; --bg: var(--paper); --bg-surface: var(--soft); --ink-soft: var(--ink2); --ink-mute: var(--ink3); --rule-soft: var(--rule); --blueprint: var(--pen); }
.doc pre code { padding: 0; background: none; }
.doc h2 { font: 600 22px var(--serif); margin: 40px 0 10px; }
.doc h3 { font: 600 18px var(--serif); margin: 28px 0 8px; }
.doc pre { background: var(--soft); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; overflow-x: auto; font-size: 14px; line-height: 1.55; }
.doc code { font-size: .92em; }
.doc :not(pre) > code { background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 15px; margin: 12px 0; }
.doc th, .doc td { border-bottom: 1px solid var(--rule); padding: 7px 10px 7px 0; text-align: left; vertical-align: top; }
.doc blockquote { margin: 16px 0; padding: 2px 16px; border-left: 3px solid var(--mark); color: var(--ink2); }
.doc img { max-width: 100%; }
.doc .mermaid { margin: 18px 0; text-align: center; }
.doc .math-display { overflow-x: auto; margin: 14px 0; }
.mcq { border-top: 1px solid var(--rule); padding: 16px 0; }
.mcq .mq { font-weight: 600; margin-bottom: 8px; }
.mcq .mq small { font-weight: 500; color: var(--ink3); margin-right: 8px; }
.mcq label { display: flex; gap: 10px; padding: 5px 0; cursor: pointer; }
.mcq label.right { color: var(--ok); font-weight: 600; }
.mcq label.wrong { color: var(--bad); }
.mcq .why { margin: 6px 0 0; color: var(--ink2); font-size: 15px; }
.doc .en-sec { color: var(--ink2); font-size: 15px; border-left: 2px solid var(--rule); padding-left: 14px; margin: 10px 0 24px; }
.doc .en-sec h1, .doc .en-sec h2, .doc .en-sec h3 { font-size: 16px; margin: 8px 0; }
.doc .en-sec pre, .doc .en-sec .lesson-figure, .doc .en-sec .mermaid, .doc .en-sec .math-display, .doc .en-sec img { display: none; }
.mcq .en { color: var(--ink3); font-size: 14px; margin: 2px 0 0; }
.credit { margin-top: 48px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--ink3); }
</style>
</head>
<body>
<header class="mast"><div class="wrap">
  <div class="title" id="brand">AI Engineer Path</div>
  <nav id="tabs"></nav>
  <div class="prefs">
    <div class="switch" id="lang" aria-label="Language"><button data-l="zh">中文</button><button data-l="en">English</button><button data-l="both">双语</button></div>
    <div class="switch" id="theme" aria-label="Theme"></div>
  </div>
</div></header>
<main class="wrap" id="app"><p class="loading">Loading…</p></main>
<footer><div class="wrap"><span id="foot1"></span><span id="sync"></span></div></footer>
<div class="peek" id="peek" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\[\[([^\]|]+)(\|[^\]]+)?\]\]/g, (m, a, b) => "<b>" + (b ? b.slice(1) : a) + "</b>");
const pad = n => String(n).padStart(3, "0");
const pref = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

// ---------- language: zh, en or both ----------
let LANG = pref.get("ai90-lang", (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
const t = (zh, en) => LANG === "en" ? en : zh;                                      // interface text
const pick = (zh, en) => LANG === "en" ? (en ?? zh) : zh;                             // plain content
const L = (zh, en) => LANG === "en" ? md(en ?? zh) : LANG === "zh" ? md(zh)          // rich content
  : (en && zh !== en ? `${md(zh)}<span class="tr">${md(en)}</span>` : md(zh));
const CN = ["一", "二", "三", "四", "五", "六", "七"];
const chapLabel = i => t(`第${CN[i]}章`, `Chapter ${i + 1}`);
const lessonLabel = n => t(`第 ${n} 课`, `Lesson ${n}`);
const TYPE_EN = { "课程": "Course", "文档": "Docs", "视频": "Video", "练习": "Practice", "书": "Book", "论文": "Paper", "业界实践": "Industry", "最新研究": "Research" };
const LEVEL_EN = { "入门": "Beginner", "进阶": "Intermediate", "精通": "Advanced" };
const typeZh = r => r[1].replace(/^[^\p{L}]+/u, "").trim();
const typeName = r => t(typeZh(r), TYPE_EN[typeZh(r)] || typeZh(r));
const enTitle = s => { const x = s.replace(/（[^）]*[\u4e00-\u9fff][^）]*）/g, "").replace(/\s+[–-]\s+[^A-Za-z]*[\u4e00-\u9fff].*$/, "").trim(); return x || s; };
const resTitle = r => LANG === "en" ? enTitle(r[2]) : r[2];
const splitTerm = s => { const i = s.search(/[A-Za-z]/); return i > 0 && /[\u4e00-\u9fff]/.test(s.slice(0, i)) ? [s.slice(0, i).trim(), s.slice(i).trim()] : [s, s]; };
const levelName = s => LANG === "en" ? s.replace(/入门|进阶|精通/g, m => LEVEL_EN[m]).replace("→", " to ") : s;
const catName = s => LANG === "en" ? (s.match(/[A-Za-z].*$/)?.[0] || s) : s;

// ---------- storage: this browser (same key as the first logbook) ----------
let S = { settings: {}, days: {}, exams: {}, weeks: {}, mock: {}, rubric: {}, seen: {}, saved: [] };
const LS = "ai90-logbook-v1";
try { const raw = localStorage.getItem(LS); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
S.seen ||= {}; S.saved ||= [];
function cacheLocal() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
const dayState = n => S.days[n] || (S.days[n] = { status: "", hours: "", understand: "", notes: "", tasks: {}, answers: {}, learned: "" });
function saveDay(n) { cacheLocal(); ghClose(n); }
const saveAll = () => cacheLocal();

// ---------- GitHub Issues sync (optional, owner only) ----------
let ISS = {};
function ghRepo() { if (S.settings.repo) return S.settings.repo;
  const m = location.hostname.match(/^([^.]+)\.github\.io$/), seg = location.pathname.split("/").filter(Boolean)[0];
  return m && seg ? m[1] + "/" + seg : ""; }
function ghToken() { return pref.get("ai90-gh-token", ""); }
function ghHeaders() { const h = { "Accept": "application/vnd.github+json" }, k = ghToken(); if (k) h.Authorization = "Bearer " + k; return h; }
function flashSync(x) { $("#sync").textContent = x; }
// visitors keep their own progress: issues are read only when this browser has a token
async function syncIssues() {
  const repo = ghRepo();
  if (!repo || !ghToken()) { flashSync(t("进度保存在这个浏览器", "Progress is saved in this browser")); return; }
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/issues?state=all&labels=daily&per_page=100`, { headers: ghHeaders() });
    if (!r.ok) throw new Error(r.status);
    ISS = {};
    for (const it of await r.json()) { const m = /^Day (\d{1,3})\b/.exec(it.title); if (m) ISS[+m[1]] = { number: it.number, url: it.html_url, state: it.state }; }
    let changed = false;
    for (const n in ISS) if (ISS[n].state === "closed" && !S.days[n]?.status) { dayState(+n).status = "done"; changed = true; }
    if (changed) cacheLocal();
    flashSync(t("已连接 GitHub：", "Connected to GitHub: ") + repo); render();
  } catch (e) { flashSync(t("进度保存在这个浏览器（GitHub 暂时连不上）", "Progress is saved in this browser (GitHub is not reachable right now)")); }
}
async function ghClose(n) {
  const it = ISS[n], repo = ghRepo(); if (!it || !ghToken() || !repo) return;
  const want = S.days[n]?.status === "done" ? "closed" : "open"; if (it.state === want) return;
  try { const r = await fetch(`https://api.github.com/repos/${repo}/issues/${it.number}`, { method: "PATCH", headers: { ...ghHeaders(), "Content-Type": "application/json" }, body: JSON.stringify({ state: want }) });
    if (r.ok) { it.state = want; toast(want === "closed" ? t(`已关闭 Issue #${it.number}`, `Closed issue #${it.number}`) : t(`已重新打开 Issue #${it.number}`, `Reopened issue #${it.number}`)); } } catch (e) {}
}

// ---------- data ----------
let D, C, DAYS, RES, BOOKS, EXAMS, PHASES;
// small note when a link needs a free account or has limits
const accNote = (k, book) => { const a = (book ? D.book_acc : D.acc)?.[k]; return a ? `<span class="acc">${esc(pick(a[0], a[1]))}</span>` : ""; };
const REVIEW = new Set([7, 14, 21, 28, 35, 42, 49, 56, 63, 70, 77, 84]);
const CP = { 15: "P1", 30: "P2", 42: "P3", 57: "P4", 70: "P5", 87: "FINAL", 88: "FINAL" };
const status = n => S.days[n]?.status || "";
const isDone = n => status(n) === "done";
const doneCount = () => DAYS.filter(d => isDone(d.n)).length;
const nextLesson = () => { for (let i = 1; i <= 90; i++) if (!isDone(i)) return i; return 90; };
const chapOf = n => PHASES.findIndex(p => n >= p[0] && n <= p[1]);
const chapName = i => pick(PHASES[i][3], PHASES[i][4]);
const coursesFor = n => C.flatMap(c => c.use.map((u, j) => ({ u, j })).filter(x => x.u[0] === n).map(x => ({ c, what: x.u[1], key: c.id + ":" + x.j })));
const examPassed = id => { const e = S.exams[id], ex = EXAMS.find(x => x.id === id); return !!(e && e.best != null && e.best >= ex.pass_pct && e.codingPass === "pass"); };
const STATUS = () => ({ done: t("已完成", "Done"), partial: t("做了一半", "Half done"), missed: t("没完成", "Missed"), "": t("还没开始", "Not started") });
const lastCheckin = () => { const ts = Object.values(S.days).map(d => d.checkedAt).filter(Boolean).sort().pop(); return ts ? Math.max(0, Math.floor((Date.now() - new Date(ts)) / 864e5)) : null; };
const hours = () => DAYS.reduce((a, d) => a + (parseFloat(S.days[d.n]?.hours) || 0), 0);
const cellClass = n => { const s = status(n); return [n === nextLesson() ? "next" : s === "done" ? "done" : s === "partial" ? "half" : s === "missed" ? "missed" : "", CP[n] ? "exam" : "", cur.view === "lesson" && n === cur.lesson ? "here" : ""].join(" "); };

// ---------- navigation ----------
let cur = { view: "overview", lesson: 1, phase: 0, kind: "all", lang: "all", q: "", rtype: "all", rphase: 0, saved: false, exam: null, week: null, bcat: "", blvl: "", blang: "" }, firstPaint = true, review = null, timer = { left: 1500, run: null }, examTimer = null;
const MAIN = () => [["overview", t("总览", "Overview")], ["lesson", t("课程", "Lessons")], ["path", t("课程路线", "Path")], ["courses", t("名校课表", "Courses")], ["resources", t("资源", "Resources")], ["tests", t("考试", "Exams")]];
const MORE = () => [["weekly", t("周复盘", "Weekly review")], ["projects", t("作品集项目", "Portfolio projects")], ["books", t("电子书库", "Free e-books")], ["report", t("补强与报告", "Catch-up and report")], ["reqs", t("需求与路线", "Goals and roadmap")], ["settings", t("设置与备份", "Settings and backup")]];
const VIEWS = () => [...MAIN(), ...MORE()].map(x => x[0]);

function chrome() {
  const inMore = MORE().some(x => x[0] === cur.view);
  $("#tabs").innerHTML = MAIN().map(([v, x]) => `<button data-v="${v}" class="${cur.view === v ? "on" : ""}">${x}</button>`).join("")
    + `<details class="more ${inMore ? "on" : ""}"><summary>${inMore ? MORE().find(x => x[0] === cur.view)[1] : t("更多", "More")}</summary><div class="menu">${MORE().map(([v, x]) => `<button data-v="${v}">${x}</button>`).join("")}</div></details>`;
  $$("#tabs [data-v]").forEach(b => b.onclick = () => { $(".more")?.removeAttribute("open"); go(b.dataset.v); });
  $("#theme").innerHTML = [["system", t("跟随系统", "Auto")], ["light", t("浅色", "Light")], ["dark", t("深色", "Dark")]].map(([v, x]) => `<button data-t="${v}">${x}</button>`).join("");
  $$("#theme button").forEach(b => b.onclick = () => setTheme(b.dataset.t)); setTheme(THEME);
  $$("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
  $("#foot1").innerHTML = t("只放官方免费链接，内容版权归原作者；与各校及平台无关。", "Free official links only; content belongs to its authors. Not affiliated with any school or platform.") + ` <a href="#" id="foot-notice">${t("版权与声明", "Licence and notices")}</a>`;
  $("#foot-notice").onclick = e => { e.preventDefault(); go("settings"); setTimeout(() => $("#notice")?.scrollIntoView(), 50); };
}
document.addEventListener("click", e => { const m = $(".more"); if (m && !m.contains(e.target)) m.removeAttribute("open"); });
let THEME = pref.get("ai90-theme", "system");
function setTheme(v) { THEME = v; pref.set("ai90-theme", v); if (v === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = v; $$("#theme button").forEach(b => b.classList.toggle("on", b.dataset.t === v)); }
function setLang(l) { LANG = l; pref.set("ai90-lang", l); document.documentElement.lang = l === "en" ? "en" : "zh-CN"; review = null; chrome(); render(); syncIssues(); }
$$("#lang button").forEach(b => b.onclick = () => setLang(b.dataset.l));
$("#brand").onclick = () => go("overview");

function go(v, extra = {}) {
  if (!("q" in extra)) cur.q = "";
  Object.assign(cur, { view: v }, extra);
  const h = v === "lesson" ? "lesson-" + cur.lesson : v === "unit" ? "unit-" + cur.unit : v;
  if (location.hash.slice(1) !== h) history.pushState(null, "", "#" + h);
  chrome(); render(); window.scrollTo({ top: 0 });
}
function fromHash() {
  const h = location.hash.slice(1), m = /^(?:lesson|day)-(\d{1,2})$/.exec(h);   // day-N keeps the links in the GitHub issues working
  if (m && +m[1] >= 1 && +m[1] <= 90) { cur.view = "lesson"; cur.lesson = +m[1]; }
  else if (/^unit-\d{2}-\d{2}$/.test(h)) { cur.view = "unit"; cur.unit = h.slice(5); }
  else if (VIEWS().includes(h)) cur.view = h;
  else cur.lesson = nextLesson();
}
window.addEventListener("popstate", () => { fromHash(); chrome(); render(); });
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 2400); }

function render() {
  if (!D) return;
  clearInterval(timer.run); timer.run = null; clearInterval(examTimer); examTimer = null;
  const views = { overview, lesson, path, unit, courses, resources, tests, weekly, projects, books, report, reqs, settings };
  $("#app").innerHTML = views[cur.view]();
  wire();
  if (cur.view === "path" || cur.view === "unit") wirePath();
  if (cur.view === "overview" && firstPaint) { firstPaint = false; requestAnimationFrame(() => $(".map")?.classList.add("ink")); }
}

function cellsFor(p) {
  const out = [];
  for (let n = p[0]; n <= p[1]; n++) out.push(`<button class="cell ${cellClass(n)}" style="--i:${n}" data-go-lesson="${n}" data-peek="${n}" aria-label="${esc(lessonLabel(n))}">${n}</button>`);
  return out.join("");
}
const chapCount = i => { const p = PHASES[i]; let k = 0; for (let j = p[0]; j <= p[1]; j++) if (isDone(j)) k++; return [k, p[1] - p[0] + 1]; };


// ---------- path: lessons from AI Engineering from Scratch ----------
let CUR = null, curLoading = false;
const DONE = new Set(JSON.parse(pref.get("aip-done", "[]")));
const saveDone = () => pref.set("aip-done", JSON.stringify([...DONE]));
const unitKey = (p, l) => p.id.slice(0, 2) + "-" + l.id.slice(0, 2);
const unitName = x => LANG === "en" ? x.en : x.zh || x.en;
function loadCur() {
  if (CUR || curLoading) return;
  curLoading = true;
  fetch("curriculum/index.json").then(r => r.json()).then(d => { CUR = d; render(); },
    () => { curLoading = false; $("#app").innerHTML = `<p class="loading">${t("课程路线载入失败，请重新整理。", "Could not load the path. Refresh to try again.")}</p>`; });
}
function findUnit(key) {
  for (const p of CUR.phases) for (const l of p.lessons) if (unitKey(p, l) === key) return [p, l];
  return [CUR.phases[0], CUR.phases[0].lessons[0]];
}
function path() {
  if (!CUR) { loadCur(); return `<p class="loading">${t("载入中…", "Loading…")}</p>`; }
  const all = CUR.phases.flatMap(p => p.lessons.map(l => unitKey(p, l))), done = all.filter(k => DONE.has(k)).length;
  return `<h1 class="page">${t("课程路线", "Learning path")}</h1>
  <p class="small" style="max-width:62ch">${t("课文、练习代码和测验来自开源课程 AI Engineering from Scratch，中文由社群翻译。按自己的节奏学，进度只存在这部电脑。", "Lessons, code and quizzes come from the open course AI Engineering from Scratch, with a community Chinese translation. Go at your own pace; progress stays on this computer.")}
  ${done} / ${all.length} ${t("课完成", "lessons done")}</p>
  ${CUR.phases.map(p => { const k = p.lessons.filter(l => DONE.has(unitKey(p, l))).length;
    return `<section class="phase"><h2>${esc(unitName(p))}<small>${k} / ${p.lessons.length}</small></h2><ul class="units">${p.lessons.map((l, i) => `
      <li class="${DONE.has(unitKey(p, l)) ? "done" : ""}"><span class="n">${i + 1}</span><button data-unit="${unitKey(p, l)}">${esc(unitName(l))}</button><span class="m">${l.min ? l.min + " min" : ""}</span></li>`).join("")}</ul></section>`; }).join("")}
  <p class="credit">${credit()}</p>`;
}
function credit() {
  const s = CUR.source;
  return t(`课程内容来自 <a href="${s.upstream}" target="_blank" rel="noopener">AI Engineering from Scratch</a>（Rohit Ghumare 与贡献者，MIT 授权），中文翻译来自 <a href="${s.translation}" target="_blank" rel="noopener">ai-engineering-from-scratch-zh</a>（MIT 授权）。`,
    `Lessons from <a href="${s.upstream}" target="_blank" rel="noopener">AI Engineering from Scratch</a> by Rohit Ghumare and contributors (MIT). Chinese translation from <a href="${s.translation}" target="_blank" rel="noopener">ai-engineering-from-scratch-zh</a> (MIT).`);
}
function unit() {
  if (!CUR) { loadCur(); return `<p class="loading">${t("载入中…", "Loading…")}</p>`; }
  const [p, l] = findUnit(cur.unit), i = p.lessons.indexOf(l), key = unitKey(p, l);
  const flat = CUR.phases.flatMap(q => q.lessons.map(x => unitKey(q, x))), at = flat.indexOf(key);
  const repo = `https://github.com/cheah20/DigitalIncubation/blob/main/docs/curriculum/${p.id}/${l.id}/`;
  return `<div class="handout">
    <aside class="margin">
      <div class="no">${i + 1}</div>
      <div class="chapname">${esc(unitName(p))}</div>
      <div class="state">${l.min ? `${l.min} min` : ""}</div>
      <ul class="ulist">${p.lessons.map(x => `<li class="${unitKey(p, x) === key ? "here" : ""} ${DONE.has(unitKey(p, x)) ? "done" : ""}"><button data-unit="${unitKey(p, x)}">${esc(unitName(x))}</button></li>`).join("")}</ul>
      <div class="pn">${at > 0 ? `<button class="textlink" data-unit="${flat[at - 1]}">${t("上一课", "Previous")}</button>` : "<span></span>"}${at < flat.length - 1 ? `<button class="textlink" data-unit="${flat[at + 1]}">${t("下一课", "Next")}</button>` : ""}</div>
      <p class="small"><button class="textlink" data-go="path">${t("回到课程路线", "Back to the path")}</button></p>
    </aside>
    <article class="body">
      <div class="doc" id="doc"><p class="loading">${t("载入课文…", "Loading the lesson…")}</p></div>
      ${l.code.length ? `<section class="part"><h2>${t("练习代码", "Code")}</h2><ul class="plain">${l.code.map(f => `<li><a href="${repo}${esc(f)}" target="_blank" rel="noopener">${esc(f)}</a></li>`).join("")}</ul></section>` : ""}
      ${l.quiz ? `<section class="part" id="mcq"><h2>${t("测验", "Quiz")}</h2><div id="quizbox"></div></section>` : ""}

function bilingual(zt, en) {

// math follows the GitHub dollar rules and is kept away from the markdown parser
function protectMath(text) {

  const out = text.split(/(^```[\s\S]*?^```)/m).map((part, i) => i % 2 ? part : part.split(/(`[^`\n]*`)/).map((bit, j) => j % 2 ? bit : bit

    .replace(/(^|[^\\$\w])\$(?![\s$])((?:\\.|[^$\\\n])+?)(?<![\s\\])\$(?![\w$])/g, (m, pre, tex) => pre + hold(tex, false))).join("")).join("");
  return [out, keep];
}
function renderDoc(text, base) {

  });
  $$("#doc img").forEach(img => { const s = img.getAttribute("src"); if (s && !/^(https?:|data:)/.test(s)) img.src = base + "docs/" + s; });
  $$("#doc a[href]").forEach(a => { if (/^https?:/.test(a.getAttribute("href"))) { a.target = "_blank"; a.rel = "noopener"; } });

function wireExam() {

function buildWorkbook() {
  const wb = XLSX.utils.book_new();
  const plan = DAYS.map(d => { const st = S.days[d.n] || {}, p = PHASES[chapOf(d.n)]; return {
    "Lesson": d.n, "Chapter": p[2] + " " + p[4], "主题": d.zh, "Topic": d.en,
    "Concepts": d.concepts.map(c => `${c[0]}: ${c[1]} | ${c[2]}`).join("\n"),
    "Resources": d.res.map(([k, s]) => `${RES[k][2]} (${s}) ${RES[k][3]}`).join("\n"),
    "Tasks": d.tasks_en.join("\n"), "任务": d.tasks.join("\n"), "Project": d.project_en, "Self-test": d.quiz_en.join("\n"), "Hand in": d.out_en,
    "Status": st.status || "", "Hours": st.hours || "", "Confidence 1-5": st.understand || "", "Notes": [st.learned, st.notes].filter(Boolean).join("\n") }; });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(plan), "Plan and check-ins");
  const ex = []; EXAMS.forEach(e => { const s = S.exams[e.id] || {}; e.mcq.forEach((q, i) => ex.push({ "Exam": e.title_en, "Lesson": e.day, "No.": i + 1, "Question": q.q_en, "A": q.o_en[0], "B": q.o_en[1], "C": q.o_en[2], "D": q.o_en[3], "Answer": String.fromCharCode(65 + q.a), "Why": q.e_en, "Best": i === 0 ? (s.best ?? "") : "" })); ex.push({ "Exam": e.title_en, "Question": "Coding: " + e.coding_en.join(" "), "Best": s.codingPass || "" }); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ex), "Exams");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.values(BOOKS).map(b => ({ "Topic": b[0], "Level": b[1], "Language": b[2], "Title": b[3], "Author": b[4], "Link": b[5], "中文": b[6], "English": b[7], "Lessons": b[8].join(", ") }))), "E-books");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.values(RES).map(r => ({ "Group": r[0], "Type": typeZh(r), "Resource": r[2], "Link": r[3], "中文": r[4], "English": r[5] }))), "Resources");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(D.reqs_en.map(r => ({ "Topic": r[0], "What it means": r[1] }))), "Goals");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(D.rubric_en.map((r, i) => ({ "Skill": r[0], "Pass when": r[1], "Evidence": r[2], "Result": S.rubric[i] || "" }))), "Rubric");
  return wb;
}
function download(name, blob) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

// ---------- events ----------
function peek(el) {
  const n = +el.dataset.peek, d = DAYS[n - 1], box = $("#peek"), withC = coursesFor(n);
  const st = n === nextLesson() ? t("下一课", "Next up") : STATUS()[status(n)];
  box.innerHTML = `<div class="s">${lessonLabel(n)} · ${st}${CP[n] ? t(" · 阶段验收", " · checkpoint") : ""}</div><b>${esc(pick(d.zh, d.en))}</b>
    ${LANG === "both" ? `<div class="s">${esc(d.en)}</div>` : ""}${withC.length ? `<ul>${[...new Set(withC.map(x => x.c.school + " " + x.c.code))].map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}`;
  box.hidden = false;
  const r = el.getBoundingClientRect();
  box.style.left = Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - 316) + "px";
  box.style.top = window.scrollY + r.bottom + 8 + "px";
}
function wireCells(root = document) {
  root.querySelectorAll("[data-go-lesson]").forEach(b => b.onclick = () => go("lesson", { lesson: +b.dataset.goLesson }));
  root.querySelectorAll("[data-peek]").forEach(b => { b.onpointerenter = () => peek(b); b.onpointerleave = () => $("#peek").hidden = true; b.onfocus = () => peek(b); b.onblur = () => $("#peek").hidden = true; });
}
const segPick = (g, cb) => g.querySelectorAll("button").forEach(b => b.onclick = () => { const on = !b.classList.contains("on"); g.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b && on)); cb(on ? b.dataset.v : ""); });
function wire() {
  $("#peek").hidden = true;

    $$("[data-open]").forEach(b => b.onclick = () => go("tests", { exam: b.dataset.open }));

  }

    [["#w-win", "win"], ["#w-block", "block"], ["#w-plan", "plan"]].forEach(([id, k]) => $(id).oninput = e => { s[k] = e.target.value; saveAll(); });

function wireLesson() {
  const n = cur.lesson, st = dayState(n);
  $$("[data-task]").forEach(cb => cb.onchange = () => {
    st.tasks[cb.dataset.task] = cb.checked; cb.closest("label").classList.toggle("ticked", cb.checked);
    const all = $$("[data-task]"), k = all.filter(x => x.checked).length, was = st.status;
    if (k === all.length) st.status = "done"; else if (k && (st.status === "" || st.status === "done")) st.status = "partial"; else if (!k && st.status === "partial") st.status = "";
    if (st.status && !st.checkedAt) st.checkedAt = new Date().toISOString();
    saveDay(n); refreshLesson(n);
    if (st.status === "done" && was !== "done") { $(`.mini [data-go-lesson="${n}"]`)?.classList.add("just"); toast(t(`第 ${n} 课完成，总进度 ${doneCount()} / 90`, `Lesson ${n} done: ${doneCount()} of 90`)); }
  });
  $$("[data-seen]").forEach(cb => cb.onchange = () => {
    S.seen[cb.dataset.seen] = cb.checked; saveAll(); cb.closest("li").classList.toggle("seen", cb.checked);
    $("#seenN").textContent = `${$$("[data-seen]").filter(x => x.checked).length} / ${$$("[data-seen]").length} ${t("看完", "watched")}`;
  });
  $$("[data-rate]").forEach(g => segPick(g, v => { (st.rate ||= {})[g.dataset.rate] = v; saveDay(n); }));
  $$("[data-qa]").forEach(x => x.oninput = () => { st.answers[x.dataset.qa] = x.value; saveDay(n); });
  $$("#stseg button").forEach(b => b.onclick = () => { st.status = st.status === b.dataset.st ? "" : b.dataset.st; st.checkedAt = new Date().toISOString(); saveDay(n); refreshLesson(n); });
  segPick($("#undseg"), v => { st.understand = v; saveDay(n); });
  $$("#undseg button").forEach(b => b.dataset.v = b.dataset.u);
  $("#ci-hours").oninput = e => { st.hours = e.target.value; saveDay(n); };
  $("#ci-learned").oninput = e => { st.learned = e.target.value; saveDay(n); };
  $("#ci-notes").oninput = e => { st.notes = e.target.value; saveDay(n); };
  $("#ci-save").onclick = () => { st.checkedAt = new Date().toISOString(); saveDay(n); toast(t(`第 ${n} 课打卡已保存`, `Lesson ${n} check-in saved`)); };
  $$(".concept > button").forEach(b => b.onclick = () => b.parentElement.classList.toggle("open"));
  $("#allc").onclick = () => { const open = !$$(".concept").every(c => c.classList.contains("open")); $$(".concept").forEach(c => c.classList.toggle("open", open)); };
  $$("[data-jump]").forEach(b => b.onclick = () => document.getElementById(b.dataset.jump)?.scrollIntoView({ behavior: "smooth" }));
  const clock = () => { $("#clock").textContent = `${String(Math.floor(timer.left / 60)).padStart(2, "0")}:${String(timer.left % 60).padStart(2, "0")}`; };
  timer.left = 1500; clock();
  $("#tgo").onclick = () => {
    if (timer.run) { clearInterval(timer.run); timer.run = null; $("#tgo").textContent = t("继续", "Resume"); return; }
    $("#tgo").textContent = t("暂停", "Pause");
    timer.run = setInterval(() => { timer.left--; clock(); if (timer.left <= 0) { clearInterval(timer.run); timer.run = null; toast(t("25 分钟到了，休息 5 分钟", "25 minutes up: take a 5 minute break")); $("#tgo").textContent = t("开始", "Start"); timer.left = 1500; clock(); } }, 1000);
  };
  $("#treset").onclick = () => { clearInterval(timer.run); timer.run = null; timer.left = 1500; clock(); $("#tgo").textContent = t("开始", "Start"); };
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) $$("[data-jump]").forEach(b => b.classList.toggle("on", b.dataset.jump === e.target.id)); }), { rootMargin: "-30% 0px -60% 0px" });
  $$(".part").forEach(s => io.observe(s));
}
function wireSettings() {

    const k = $("#g-tok").value.trim(); try { k ? localStorage.setItem("ai90-gh-token", k) : localStorage.removeItem("ai90-gh-token"); } catch (e) {}

    catch (err) { $("#bmsg").textContent = t("这个文件不是进度备份", "That file is not a progress backup"); } };
  $("#xl").onclick = () => { try { if (!window.XLSX) throw new Error(t("Excel 组件还没载入，请检查网络后重新整理。", "The Excel library did not load; check your connection and refresh."));

}
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea, select")) return;
  if (e.key === "/") { const q = $("#q"); if (q) { e.preventDefault(); q.focus(); } }
  if (cur.view === "lesson" && e.key === "ArrowLeft" && cur.lesson > 1) go("lesson", { lesson: cur.lesson - 1 });
  if (cur.view === "lesson" && e.key === "ArrowRight" && cur.lesson < 90) go("lesson", { lesson: cur.lesson + 1 });
});
